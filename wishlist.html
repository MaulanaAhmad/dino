<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wishlist — Tempat Impian Kita</title>
  <meta name="description" content="Daftar tempat impian Dido & Novi.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7A2E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Impian Kita">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <link rel="icon" href="./assets/img/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/app.css">

  <style>
    /* (sync-pill, modal, transisi, .place-card & aksinya sudah di assets/css/app.css — shared) */

    /* Tanggal rencana bisa diketuk -> langsung ke Kalender di tanggal tersebut */
    .place-card__tanggal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink-soft);
      text-decoration: none;
    }
    .place-card__tanggal-sisa {
      font-size: 11px;
      font-weight: 700;
      color: var(--wine);
      background: var(--blush);
      border-radius: 999px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>

  <main class="container" x-data="wishlist">
    <div class="topbar">
      <div>
        <p class="tag" x-text="isFilmTab ? '🎬 Wishlist' : '📍 Wishlist'"></p>
        <h1 class="mt-sm" x-text="isFilmTab ? 'Watchlist Film' : 'Tempat Impian'"></h1>
      </div>
      <button class="clay-icon-btn" type="button" @click="openAddModal" :aria-label="isFilmTab ? 'Tambah film' : 'Tambah tempat'">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="row mt-sm" style="gap:8px;">
      <button type="button" class="clay-btn secondary" :class="{ 'is-active': activeType === 'tempat' }" @click="setActiveType('tempat')" style="flex:1; padding:10px 12px; font-size:13px;">🗺️ Tempat</button>
      <button type="button" class="clay-btn secondary" :class="{ 'is-active': activeType === 'film' }" @click="setActiveType('film')" style="flex:1; padding:10px 12px; font-size:13px;">🎬 Film</button>
    </div>

    <div class="row mt-sm" style="gap:8px;">
      <div class="sync-pill">
        <span class="sync-dot" :class="{ 'is-syncing': syncStatus === 'syncing', 'is-offline': syncStatus === 'offline' }"></span>
        <span x-text="statusLabel"></span>
      </div>
      <span class="tag" x-show="ringkasanTeks" x-cloak x-text="ringkasanTeks"></span>
    </div>

    <div class="row mt-md" style="overflow-x:auto; padding-bottom:4px;">
      <button type="button" class="clay-btn secondary" :class="{ 'is-active': filter === 'all' }" @click="filter = 'all'" style="padding:10px 18px; font-size:13px;">Semua</button>
      <button type="button" class="clay-btn secondary" :class="{ 'is-active': filter === 'pending' }" @click="filter = 'pending'" style="padding:10px 18px; font-size:13px;">Belum</button>
      <button type="button" class="clay-btn secondary" :class="{ 'is-active': filter === 'done' }" @click="filter = 'done'" style="padding:10px 18px; font-size:13px;">Sudah</button>
    </div>

    <section class="mt-md muted center" x-show="errorMessage" x-text="errorMessage"></section>

    <section class="stack mt-md">
      <div class="clay-card empty-state" x-show="!filteredPlaces.length" x-text="emptyStateText"></div>

      <template x-for="place in filteredPlaces" :key="place.id">
        <div class="clay-card place-card" :class="{ 'is-done': place.visited }">
          <button class="place-card__icon" @click="toggleVisited(place)" :aria-label="place.item_type === 'film' ? 'Tandai sudah ditonton' : 'Tandai sudah dikunjungi'" style="border:none;cursor:pointer;">
            <svg class="icon" viewBox="0 0 24 24" x-show="place.visited"><path d="M20 6 9 17l-5-5"/></svg>
            <svg class="icon" viewBox="0 0 24 24" x-show="!place.visited && place.item_type === 'film'"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="7" y1="5" x2="7" y2="19"/><line x1="17" y1="5" x2="17" y2="19"/><line x1="3" y1="9" x2="7" y2="9"/><line x1="3" y1="15" x2="7" y2="15"/><line x1="17" y1="9" x2="21" y2="9"/><line x1="17" y1="15" x2="21" y2="15"/></svg>
            <svg class="icon" viewBox="0 0 24 24" x-show="!place.visited && place.item_type !== 'film'"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <div style="flex:1;min-width:0;">
            <p class="place-card__title" style="font-weight:700;margin:0;" x-text="place.name"></p>
            <p class="tag mt-sm" x-text="place.category || 'Lainnya'"></p>
            <p class="muted mt-sm" style="font-size:13px;" x-show="place.who">💌 <span x-text="place.who"></span></p>
            <p class="muted mt-sm" style="font-size:13px;" x-show="place.location"><span x-text="place.item_type === 'film' ? '📺' : '📍'"></span> <span x-text="place.location"></span></p>
            <a class="place-card__tanggal mt-sm" x-show="place.visit_date" :href="kalenderUrl(place)">
              🗓️ <span x-text="formatDateID(place.visit_date)"></span>
              <span class="place-card__tanggal-sisa" x-text="daysUntilLabel(place.visit_date)"></span>
            </a>
            <p class="muted mt-sm" style="font-size:13px;" x-show="place.note" x-text="place.note"></p>
          </div>
          <div class="place-card__actions">
            <button type="button" @click="openEditModal(place)" aria-label="Edit">
              <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" @click="mintaHapus(place)" aria-label="Hapus">
              <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </div>
      </template>
    </section>

    <!-- Modal tambah/edit tempat -->
    <div class="modal-backdrop" x-show="modalOpen" x-cloak @click.self="closeModal"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <form class="modal-sheet stack" @submit.prevent="submitForm"
            x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
            x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;" x-text="(form.item_type === 'film' ? (editingId ? 'Edit Film' : 'Tambah Film') : (editingId ? 'Edit Tempat' : 'Tambah Tempat'))"></h2>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;" x-text="form.item_type === 'film' ? 'Judul film' : 'Nama tempat'"></label>
          <input class="clay-input" x-model="form.name" :placeholder="form.item_type === 'film' ? 'Contoh: La La Land' : 'Contoh: Kawah Ijen'" required>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;" x-text="form.item_type === 'film' ? 'Genre' : 'Kategori'"></label>
          <select class="clay-select" x-model="form.category">
            <template x-for="opt in categoryOptions" :key="opt">
              <option :value="opt" x-text="opt"></option>
            </template>
          </select>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Yang pengen ke sana</label>
          <select class="clay-select" x-model="form.who">
            <option value="Dido & Novi">Dido & Novi</option>
            <option value="Dido">Dido</option>
            <option value="Novi">Novi</option>
          </select>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;" x-text="locationLabel"></label>
          <input class="clay-input" x-model="form.location" :placeholder="locationPlaceholder">
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;" x-text="visitDateLabel"></label>
          <button type="button" class="date-picker-trigger" :class="{ 'is-placeholder': !form.visit_date }" @click="openDatePicker">
            <span x-text="datePickerLabel"></span>
            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
          </button>
          <div class="date-picker-panel" x-show="datePickerOpen" x-cloak>
            <div class="month-nav">
              <button type="button" class="clay-icon-btn" @click="datePickerPrevMonth" aria-label="Bulan sebelumnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <p class="display" style="font-size:15px;" x-text="BULAN_ID[datePickerViewMonth] + ' ' + datePickerViewYear"></p>
              <button type="button" class="clay-icon-btn" @click="datePickerNextMonth" aria-label="Bulan berikutnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
            <div class="calendar-weekdays">
              <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
            </div>
            <div class="calendar-grid">
              <template x-for="cell in datePickerDays" :key="cell.dateStr">
                <button type="button" class="calendar-cell" :class="{ 'is-other-month': !cell.inMonth, 'is-today': cell.isToday, 'is-selected': cell.dateStr === form.visit_date }" @click="pickDate(cell.dateStr)">
                  <span x-text="cell.day"></span>
                </button>
              </template>
            </div>
            <button type="button" class="date-picker-clear" @click="clearDate" x-show="form.visit_date">Hapus tanggal</button>
          </div>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Catatan (opsional)</label>
          <textarea class="clay-textarea" x-model="form.note" rows="3" placeholder="Kenapa pengen ke sini?"></textarea>
        </div>

        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="closeModal" style="flex:1;">Batal</button>
          <button type="submit" class="clay-btn" style="flex:1;">Simpan</button>
        </div>
      </form>
    </div>

    <!-- Konfirmasi hapus (pengganti confirm() bawaan browser) -->
    <div class="modal-backdrop" x-show="confirmDelete" x-cloak @click.self="batalHapus"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <div class="modal-sheet stack"
           x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
           x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;" x-text="confirmDelete?.item_type === 'film' ? 'Hapus film ini?' : 'Hapus tempat ini?'"></h2>
        <p class="muted" style="font-size:14px;line-height:1.6;margin:0;">
          “<span x-text="confirmDelete?.name"></span>” akan hilang dari wishlist.
        </p>
        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="batalHapus" style="flex:1;">Batal</button>
          <button type="button" class="clay-btn" @click="hapusTerkonfirmasi" style="flex:1;">Hapus</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom navigation (identik di semua halaman) -->
  <nav class="bottom-nav" aria-label="Navigasi utama" x-data="bottomNav">
    <div class="bottom-nav__bar">
      <a class="bottom-nav__item" href="./index.html" :class="{ 'is-active': isActive('index.html') }" :aria-current="isActive('index.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Beranda</span>
      </a>
      <a class="bottom-nav__item" href="./kalender.html" :class="{ 'is-active': isActive('kalender.html') }" :aria-current="isActive('kalender.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        <span>Kalender</span>
      </a>
      <a class="bottom-nav__item" href="./cerita.html" :class="{ 'is-active': isActive('cerita.html') }" :aria-current="isActive('cerita.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 5c2-1 5-1 8 0 3-1 6-1 8 0v14c-2-1-5-1-8 0-3-1-6-1-8 0Z"/><path d="M12 5v14"/></svg>
        <span>Cerita</span>
      </a>
      <a class="bottom-nav__item" href="./wishlist.html" :class="{ 'is-active': isActive('wishlist.html') }" :aria-current="isActive('wishlist.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Wishlist</span>
      </a>
      <a class="bottom-nav__item" href="./nikah.html" :class="{ 'is-active': isActive('nikah.html') }" :aria-current="isActive('nikah.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="15" r="5.5"/><circle cx="15.5" cy="10.5" r="5.5"/></svg>
        <span>Nikah</span>
      </a>
    </div>
  </nav>

  <!-- Supabase client (CDN, tanpa bundler) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/wishlist.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
