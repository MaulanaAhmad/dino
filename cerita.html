<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cerita Kita — Tempat Impian Kita</title>
  <meta name="description" content="Timeline momen Dido & Novi.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7A2E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Impian Kita">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <link rel="icon" href="./assets/img/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/app.css">

  <style>
    /* (sync-pill, empty-state, modal, transisi, dll sudah dipindah ke assets/css/app.css — shared) */
    .moment-card { padding: 0; overflow: hidden; }

    /* Foto TIDAK dipotong: rasio aslinya dipertahankan.
       Dulu dipaksa 4:3 + object-fit:cover — foto potret (mayoritas foto HP)
       kehilangan hampir separuh tingginya. Sekarang tinggi mengikuti foto,
       dibatasi 480px; foto yang sangat menjulang disempurnakan dengan
       object-fit:contain di atas latar blush, bukan dipangkas. */
    .moment-card__photo-btn {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: var(--blush);
      cursor: pointer;
      line-height: 0;
    }
    .moment-card__photo {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      display: block;
      background: var(--blush);
    }

    .moment-card__body { padding: 16px 18px 18px; }
    .moment-card__heart { background: none; border: none; padding: 4px; cursor: pointer; color: var(--ink-soft); transition: transform .2s ease, color .2s ease; }
    .moment-card__heart:active { transform: scale(.85); }
    .moment-card__heart .icon.is-loved { color: var(--rose); }
    .moment-card__act { background: none; border: none; padding: 4px; cursor: pointer; color: var(--ink-soft); }

    .moment-card__reaksi {
      margin: 8px 0 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--rose);
    }

    .moment-group-label {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 22px 0 12px;
    }

    .moment-preview { width: 100%; max-height: 220px; object-fit: contain; background: var(--blush); border-radius: var(--radius-sm); margin-top: 10px; }
  </style>
</head>
<body>

  <main class="container" x-data="cerita">
    <div class="topbar">
      <div>
        <p class="tag">💛 Cerita Kita</p>
        <h1 class="mt-sm">Timeline Kita</h1>
      </div>
      <button class="clay-icon-btn" type="button" @click="openAddModal" aria-label="Tambah cerita" x-show="me" x-cloak>
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="row mt-sm" style="gap:8px;">
      <div class="sync-pill">
        <span class="sync-dot" :class="{ 'is-syncing': syncStatus === 'syncing', 'is-offline': syncStatus === 'offline' }"></span>
        <span x-text="statusLabel"></span>
      </div>
      <span class="tag" x-show="jumlahLabel" x-cloak>📷 <span x-text="jumlahLabel"></span></span>
    </div>

    <!-- Sekali saja: biar reaksi tahu siapa yang menekan hati -->
    <div class="identity-card mt-sm" x-show="!me" x-cloak>
      <p class="muted" style="font-size:13px;margin:0 0 10px;">Biar ketahuan siapa yang menulis dan menyukai — kamu yang mana?</p>
      <div class="row" style="gap:8px;">
        <template x-for="nama in ['Dido', 'Novi']" :key="nama">
          <button type="button" class="clay-btn secondary" @click="pilihIdentitas(nama)" style="flex:1;padding:10px 12px;font-size:13px;" x-text="nama"></button>
        </template>
      </div>
    </div>

    <section class="mt-md muted center" x-show="errorMessage" x-text="errorMessage"></section>

    <section class="mt-md">
      <div class="clay-card empty-state" x-show="!moments.length" x-cloak>Belum ada cerita di sini. Yuk mulai dari satu foto 🤍</div>

      <!-- Dikelompokkan per bulan supaya linimasa panjang tetap terbaca -->
      <template x-for="grup in momentGroups" :key="grup.key">
        <div>
          <p class="moment-group-label" x-text="grup.label"></p>

          <div class="stack" style="gap:16px;">
            <template x-for="moment in grup.items" :key="moment.id">
              <div class="clay-card moment-card">
                <button type="button" class="moment-card__photo-btn" @click="bukaLightbox(moment)" aria-label="Lihat foto ukuran penuh">
                  <img :src="moment.photo_url" :alt="moment.caption || 'Momen Dido & Novi'" class="moment-card__photo" loading="lazy">
                </button>

                <div class="moment-card__body">
                  <p class="tag">🗓️ <span x-text="formatDateID(moment.moment_date)"></span></p>
                  <p class="mt-sm" style="font-weight:700;" x-show="moment.caption" x-text="moment.caption"></p>

                  <div class="row mt-sm" style="justify-content: space-between;">
                    <p class="muted" style="font-size:13px;" x-show="moment.who">💌 <span x-text="moment.who"></span></p>
                    <div class="row" style="gap:2px;">
                      <button type="button" class="moment-card__heart" @click="toggleLoved(moment)" aria-label="Suka momen ini">
                        <svg class="icon" viewBox="0 0 24 24" :class="{ 'is-loved': akuSuka(moment) }" :fill="akuSuka(moment) ? 'currentColor' : 'none'"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                      </button>
                      <button type="button" class="moment-card__act" @click="openEditModal(moment)" aria-label="Edit cerita">
                        <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                      </button>
                      <button type="button" class="moment-card__act" @click="mintaHapus(moment)" aria-label="Hapus cerita">
                        <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
                      </button>
                    </div>
                  </div>

                  <p class="moment-card__reaksi" x-show="reaksiLabel(moment)" x-cloak>
                    🤍 <span x-text="reaksiLabel(moment)"></span>
                  </p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>

    <button type="button" class="identity-ganti" @click="gantiIdentitas" x-show="me" x-cloak>
      Kamu masuk sebagai <strong x-text="me"></strong> · ganti
    </button>

    <!-- Lightbox foto ukuran penuh -->
    <div class="lightbox" x-show="lightbox" x-cloak @click.self="tutupLightbox"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <button type="button" class="lightbox__close" @click="tutupLightbox" aria-label="Tutup">×</button>
      <img :src="lightbox?.photo_url" :alt="lightbox?.caption || 'Momen Dido & Novi'">
      <p class="lightbox__caption" x-show="lightbox?.caption" x-text="lightbox?.caption"></p>
    </div>

    <!-- Konfirmasi hapus -->
    <div class="modal-backdrop" x-show="confirmDelete" x-cloak @click.self="batalHapus"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <div class="modal-sheet stack"
           x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
           x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;">Hapus cerita ini?</h2>
        <img :src="confirmDelete?.photo_url" alt="" class="moment-preview" x-show="confirmDelete">
        <p class="muted" style="font-size:14px;margin:0;">Foto dan catatannya akan hilang permanen.</p>
        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="batalHapus" style="flex:1;">Batal</button>
          <button type="button" class="clay-btn" @click="hapusTerkonfirmasi" style="flex:1;">Hapus</button>
        </div>
      </div>
    </div>

    <!-- Modal tambah cerita -->
    <div class="modal-backdrop" x-show="modalOpen" x-cloak @click.self="closeModal"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <form class="modal-sheet stack" @submit.prevent="submitForm"
            x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
            x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;" x-text="modalJudul"></h2>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Foto</label>
          <input type="file" accept="image/*" @change="onFileSelected" id="moment-photo-input" style="display:none;">
          <button type="button" class="clay-btn secondary" @click="document.getElementById('moment-photo-input').click()">
            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
            <span x-text="labelTombolFoto"></span>
          </button>
          <img :src="previewSrc" x-show="previewSrc" class="moment-preview" alt="Pratinjau foto">
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Tanggal momen</label>
          <button type="button" class="date-picker-trigger" @click="openDatePicker">
            <span x-text="datePickerLabel"></span>
            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
          </button>
          <div class="date-picker-panel" x-show="datePickerOpen" x-cloak>
            <div class="month-nav">
              <button type="button" class="clay-icon-btn" @click="datePickerPrevMonth" aria-label="Bulan sebelumnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <p class="display" style="font-size:15px;" x-text="BULAN_ID[datePickerViewMonth] + ' ' + datePickerViewYear"></p>
              <button type="button" class="clay-icon-btn" @click="datePickerNextMonth" aria-label="Bulan berikutnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
            <div class="calendar-weekdays">
              <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
            </div>
            <div class="calendar-grid">
              <template x-for="cell in datePickerDays" :key="cell.dateStr">
                <button type="button" class="calendar-cell" :class="{ 'is-other-month': !cell.inMonth, 'is-today': cell.isToday, 'is-selected': cell.dateStr === form.moment_date }" @click="pickDate(cell.dateStr)">
                  <span x-text="cell.day"></span>
                </button>
              </template>
            </div>
          </div>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Caption (opsional)</label>
          <textarea class="clay-textarea" x-model="form.caption" rows="3" placeholder="Ceritain momennya..."></textarea>
        </div>

        <p class="muted" style="font-size:13px;margin:0;">Dikirim sebagai <strong x-text="form.who"></strong></p>

        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="closeModal" :disabled="uploading" style="flex:1;">Batal</button>
          <button type="submit" class="clay-btn" :disabled="uploading" style="flex:1;">
            <span x-show="!uploading">Simpan</span>
            <span x-show="uploading" x-cloak>Mengunggah...</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Bottom navigation (identik di semua halaman) -->
  <nav class="bottom-nav" aria-label="Navigasi utama" x-data="bottomNav">
    <div class="bottom-nav__bar">
      <a class="bottom-nav__item" href="./index.html" :class="{ 'is-active': isActive('index.html') }" :aria-current="isActive('index.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Beranda</span>
      </a>
      <a class="bottom-nav__item" href="./kalender.html" :class="{ 'is-active': isActive('kalender.html') }" :aria-current="isActive('kalender.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        <span>Kalender</span>
      </a>
      <a class="bottom-nav__item" href="./cerita.html" :class="{ 'is-active': isActive('cerita.html') }" :aria-current="isActive('cerita.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 5c2-1 5-1 8 0 3-1 6-1 8 0v14c-2-1-5-1-8 0-3-1-6-1-8 0Z"/><path d="M12 5v14"/></svg>
        <span>Cerita</span>
      </a>
      <a class="bottom-nav__item" href="./wishlist.html" :class="{ 'is-active': isActive('wishlist.html') }" :aria-current="isActive('wishlist.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Wishlist</span>
      </a>
      <a class="bottom-nav__item" href="./nikah.html" :class="{ 'is-active': isActive('nikah.html') }" :aria-current="isActive('nikah.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="15" r="5.5"/><circle cx="15.5" cy="10.5" r="5.5"/></svg>
        <span>Nikah</span>
      </a>
    </div>
  </nav>

  <!-- Supabase client (CDN, tanpa bundler) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/cerita.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
