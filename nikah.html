<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rencana Nikah — Tempat Impian Kita</title>
  <meta name="description" content="Checklist & rencana pernikahan Dido & Novi.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7A2E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Impian Kita">
  <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
  <link rel="icon" href="./assets/img/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/app.css">

  <style>
    /* (sync-pill, modal bottom-sheet, transisi, date-picker sudah di assets/css/app.css — shared) */

    /* ---------- Hitung mundur ke langkah terdekat ---------- */
    .nikah-hero { padding: 28px 22px 24px; }
    .nikah-ring {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wine);
      background: linear-gradient(145deg, var(--blush), var(--cream));
      border: 1px solid var(--line);
      box-shadow: var(--clay-shadow-out);
    }
    .nikah-ring .icon { width: 30px; height: 30px; }
    /* Hari-H sebuah langkah: cincinnya keemasan, senada hiasan hari jadi di Beranda */
    .nikah-hero.is-hari-ini .nikah-ring {
      background: linear-gradient(145deg, var(--gold), var(--rose-soft));
      border-color: var(--gold);
      box-shadow: var(--clay-shadow-out), 0 0 22px rgba(199, 162, 75, .45);
    }
    .nikah-hero__angka {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 600;
      line-height: 1.05;
      color: var(--wine);
      margin: 0;
    }
    .nikah-hero__menuju {
      font-size: 14px;
      color: var(--ink-soft);
      margin: 6px 0 0;
    }
    .nikah-hero__judul {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 22px;
      color: var(--rose);
      margin: 2px 0 0;
      line-height: 1.3;
    }
    .nikah-hero__tanggal {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: var(--wine);
      background: var(--blush);
      border-radius: 999px;
      padding: 6px 14px;
      margin: 14px 0 0;
    }

    /* ---------- Timeline langkah ---------- */
    .tl {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .tl-item {
      position: relative;
      padding: 0 0 16px 32px;
    }
    .tl-item:last-child { padding-bottom: 0; }

    /* Garis penghubung: dari titik item ini ke titik item berikutnya. */
    .tl-item::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 30px;
      bottom: -30px;
      width: 2px;
      border-radius: 2px;
      background: var(--line);
    }
    .tl-item:last-child::before { display: none; }
    .tl-item.is-selesai::before { background: linear-gradient(var(--gold), var(--line)); }

    .tl-dot {
      position: absolute;
      left: 2px;
      top: 22px;
      z-index: 1;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      border: 2px solid #D9CBC6;
    }
    .tl-item.is-dijadwalkan .tl-dot {
      background: var(--rose);
      border-color: var(--rose);
      box-shadow: 0 0 0 4px rgba(180, 86, 107, .16);
    }
    .tl-item.is-selesai .tl-dot {
      color: var(--paper);
      background: linear-gradient(145deg, #E3C77F, var(--gold));
      border-color: var(--gold);
    }
    .tl-dot .icon { width: 10px; height: 10px; stroke-width: 3.2; }

    .tl-card { padding: 0; overflow: hidden; }
    /* Kartu ini berisi form — efek "ditekan" dari .clay-card dipindah ke tombol judulnya saja. */
    .tl-card:active { transform: none; box-shadow: var(--clay-shadow-out); }
    .tl-card.is-tmp { opacity: .6; }

    .tl-head { display: flex; align-items: flex-start; }
    .tl-toggle {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 16px 8px 16px 18px;
      font-family: var(--font-body);
      text-align: left;
      color: var(--ink);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform .2s ease;
    }
    .tl-toggle:active { transform: scale(.98); }
    .tl-edit {
      flex: none;
      margin: 12px 12px 0 0;
      padding: 6px;
      color: var(--ink-soft);
      background: none;
      border: none;
      cursor: pointer;
    }
    .tl-edit .icon { width: 18px; height: 18px; }

    .tl-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .03em;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .tl-badge.is-selesai { color: #5B4413; background: linear-gradient(145deg, #EED9A0, var(--gold)); }
    .tl-badge.is-dijadwalkan { color: var(--paper); background: var(--rose); }
    .tl-badge.is-belum { color: #6E5559; background: #EEE6E3; }

    .tl-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--wine);
    }
    .tl-date { font-size: 13px; color: var(--ink-soft); }
    .tl-date.is-menyusul { font-style: italic; }
    .tl-sisa {
      font-size: 11px;
      font-weight: 700;
      color: var(--wine);
      background: var(--blush);
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 4px;
    }
    .tl-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
    }
    .tl-chevron { width: 14px; height: 14px; transition: transform .2s ease; }
    .tl-card.is-open .tl-chevron { transform: rotate(180deg); }

    .tl-body {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
    }
    .tl-section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 0 0 10px;
    }

    .tl-section-label.is-catatan { margin-top: 22px; }

    /* ---------- Checklist ---------- */
    .ck-list { list-style: none; margin: 0; padding: 0; }
    .ck-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
    }
    .ck-item.is-tmp { opacity: .55; }
    .ck-box {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      background: var(--cream);
      border: 1px solid var(--line);
      box-shadow: var(--clay-shadow-in);
      cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    .ck-box:active { transform: scale(.9); }
    .ck-box .icon { width: 16px; height: 16px; stroke-width: 2.6; }
    .ck-item.is-done .ck-box {
      background: linear-gradient(145deg, var(--rose), var(--wine));
      border-color: transparent;
      box-shadow: var(--clay-shadow-out-sm);
    }
    .ck-text {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .ck-item.is-done .ck-text { color: var(--ink-soft); text-decoration: line-through; }
    .ck-hapus {
      flex: none;
      padding: 6px;
      color: var(--ink-soft);
      background: none;
      border: none;
      cursor: pointer;
    }
    .ck-hapus .icon { width: 16px; height: 16px; }
    .ck-kosong { font-size: 13px; margin: 0 0 4px; }

    .ck-tambah {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .ck-tambah .clay-input { padding: 11px 14px; font-size: 14px; }
    .ck-tambah .clay-icon-btn { flex: none; width: 44px; height: 44px; border-radius: 16px; }

    .catatan-status { font-size: 11px; font-weight: 700; color: #8A6A1F; }
    .catatan-status.is-menyimpan { color: var(--ink-soft); }
    .catatan-status.is-gagal { color: var(--rose); }

    .sheet-hapus {
      display: block;
      width: 100%;
      text-align: center;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      color: var(--rose);
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <main class="container" x-data="nikah">
    <div class="topbar">
      <div>
        <p class="tag">💍 Rencana Nikah</p>
        <h1 class="mt-sm">Perjalanan Menuju <em>Nikah</em></h1>
      </div>
      <button class="clay-icon-btn" type="button" @click="bukaTambah" aria-label="Tambah langkah">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="row mt-sm" style="gap:8px;">
      <div class="sync-pill">
        <span class="sync-dot" :class="{ 'is-syncing': syncStatus === 'syncing', 'is-offline': syncStatus === 'offline' }"></span>
        <span x-text="statusLabel"></span>
      </div>
      <span class="tag" x-show="ringkasanTeks" x-cloak x-text="ringkasanTeks"></span>
    </div>

    <section class="mt-md muted center" x-show="errorMessage" x-cloak x-text="errorMessage"></section>

    <!-- Hitung mundur ke langkah bertanggal terdekat -->
    <section class="clay nikah-hero center mt-md" x-show="loaded" x-cloak :class="{ 'is-hari-ini': sisaHariTerdekat === 0 }">
      <div class="nikah-ring">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="15" r="5.5"/><circle cx="15.5" cy="10.5" r="5.5"/></svg>
      </div>

      <template x-if="milestoneTerdekat">
        <div>
          <p class="nikah-hero__angka" x-show="sisaHariTerdekat > 0" x-text="sisaHariTerdekat"></p>
          <p class="nikah-hero__menuju" x-show="sisaHariTerdekat > 0">hari lagi menuju</p>
          <p class="nikah-hero__angka" style="font-size:40px;" x-show="sisaHariTerdekat === 0">Hari ini!</p>
          <p class="nikah-hero__judul" x-text="milestoneTerdekat.title"></p>
          <p class="nikah-hero__tanggal">🗓️ <span x-text="formatTanggalPanjang(milestoneTerdekat.event_date)"></span></p>
        </div>
      </template>

      <template x-if="!milestoneTerdekat">
        <div>
          <h2 class="display" style="font-size:22px;">Langkah demi langkah, <em>berdua</em> 🤍</h2>
          <p class="muted" style="font-size:14px;line-height:1.6;margin:10px 0 0;">
            Belum ada langkah yang dijadwalkan. Begitu salah satunya punya tanggal, hitung mundurnya muncul di sini.
          </p>
        </div>
      </template>
    </section>

    <!-- Timeline langkah -->
    <section class="mt-lg">
      <div class="clay-card empty-state" x-show="loaded && !milestones.length" x-cloak>
        Belum ada langkah perjalanan. Ketuk + untuk menambah 🤍
      </div>

      <ol class="tl">
        <template x-for="m in sortedMilestones" :key="m.id">
          <li class="tl-item" :class="'is-' + statusKey(m)">
            <span class="tl-dot" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" x-show="statusKey(m) === 'selesai'"><path d="M20 6 9 17l-5-5"/></svg>
            </span>

            <div class="clay-card tl-card" :class="{ 'is-open': expandedId === m.id, 'is-tmp': m._tmp }">
              <div class="tl-head">
                <button type="button" class="tl-toggle" @click="toggleExpand(m)" :aria-expanded="expandedId === m.id ? 'true' : 'false'">
                  <span class="tl-badge" :class="'is-' + statusKey(m)" x-text="statusLabelOf(m)"></span>
                  <span class="tl-title" x-text="m.title"></span>
                  <span class="tl-date" :class="{ 'is-menyusul': !m.event_date }">
                    🗓️ <span x-text="tanggalLabel(m)"></span>
                    <span class="tl-sisa" x-show="sisaLabel(m)" x-text="sisaLabel(m)"></span>
                  </span>
                  <span class="tl-meta">
                    <span x-text="progressOf(m.id).total ? `☑️ ${progressOf(m.id).done}/${progressOf(m.id).total} checklist` : 'Checklist & catatan'"></span>
                    <svg class="icon tl-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                  </span>
                </button>
                <button type="button" class="tl-edit" @click="bukaEdit(m)" aria-label="Edit langkah" x-show="!m._tmp">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
              </div>

              <div class="tl-body" x-show="expandedId === m.id" x-cloak x-transition.opacity.duration.200ms>
                <!-- Checklist -->
                <p class="tl-section-label">Checklist</p>
                <ul class="ck-list">
                  <template x-for="item in checklistOf(m.id)" :key="item.id">
                    <li class="ck-item" :class="{ 'is-done': item.done, 'is-tmp': item._tmp }">
                      <button type="button" class="ck-box" role="checkbox" :aria-checked="item.done ? 'true' : 'false'" :aria-label="item.text" @click="toggleItem(item)">
                        <svg class="icon" viewBox="0 0 24 24" x-show="item.done"><path d="M20 6 9 17l-5-5"/></svg>
                      </button>
                      <span class="ck-text" x-text="item.text"></span>
                      <button type="button" class="ck-hapus" @click="hapusItem(item)" aria-label="Hapus item" x-show="!item._tmp">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
                      </button>
                    </li>
                  </template>
                </ul>
                <p class="muted ck-kosong" x-show="!checklistOf(m.id).length">Belum ada item. Tambahkan yang perlu disiapkan untuk langkah ini.</p>

                <form class="ck-tambah" @submit.prevent="tambahItem(m)">
                  <input class="clay-input" x-model="newItemText[m.id]" placeholder="Tambah item..." maxlength="200" aria-label="Item checklist baru">
                  <button type="submit" class="clay-icon-btn" aria-label="Tambah item">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  </button>
                </form>

                <!-- Catatan hasil, tersimpan saat keluar dari kolom -->
                <p class="tl-section-label is-catatan">
                  <label :for="'catatan-' + m.id">Catatan hasil</label>
                  <span class="catatan-status" :class="'is-' + (catatanStatus[m.id] || '')" x-text="catatanStatusTeks(m.id)"></span>
                </p>
                <textarea class="clay-textarea" rows="3" :id="'catatan-' + m.id"
                          x-model="catatanDraft[m.id]"
                          @focus="catatanFokusId = m.id"
                          @blur="simpanCatatan(m)"
                          placeholder="Hasil obrolan, keputusan, hal yang perlu diingat..."></textarea>
              </div>
            </div>
          </li>
        </template>
      </ol>
    </section>

    <!-- Bottom sheet tambah/edit langkah -->
    <div class="modal-backdrop" x-show="sheetOpen" x-cloak @click.self="tutupSheet"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <form class="modal-sheet stack" @submit.prevent="simpanMilestone"
            x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
            x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;" x-text="sheetJudul"></h2>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Judul</label>
          <input class="clay-input" x-model="form.title" placeholder="Contoh: Lamaran" required>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Tanggal (opsional)</label>
          <button type="button" class="date-picker-trigger" :class="{ 'is-placeholder': !form.event_date }" @click="openDatePicker">
            <span x-text="datePickerLabel"></span>
            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
          </button>
          <div class="date-picker-panel" x-show="datePickerOpen" x-cloak>
            <div class="month-nav">
              <button type="button" class="clay-icon-btn" @click="datePickerPrevMonth" aria-label="Bulan sebelumnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <p class="display" style="font-size:15px;" x-text="BULAN_ID[datePickerViewMonth] + ' ' + datePickerViewYear"></p>
              <button type="button" class="clay-icon-btn" @click="datePickerNextMonth" aria-label="Bulan berikutnya">
                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
            <div class="calendar-weekdays">
              <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
            </div>
            <div class="calendar-grid">
              <template x-for="cell in datePickerDays" :key="cell.dateStr">
                <button type="button" class="calendar-cell" :class="{ 'is-other-month': !cell.inMonth, 'is-today': cell.isToday, 'is-selected': cell.dateStr === form.event_date }" @click="pickDate(cell.dateStr)">
                  <span x-text="cell.day"></span>
                </button>
              </template>
            </div>
            <button type="button" class="date-picker-clear" @click="clearDate" x-show="form.event_date">Hapus tanggal</button>
          </div>
        </div>

        <div class="stack" style="gap:10px;">
          <label class="muted" style="font-size:13px;font-weight:700;">Status</label>
          <select class="clay-select" x-model="form.status">
            <template x-for="opt in statusOptions" :key="opt.value">
              <option :value="opt.value" x-text="opt.label" :selected="opt.value === form.status"></option>
            </template>
          </select>
        </div>

        <p class="muted" style="font-size:13px;margin:0;color:var(--rose);" x-show="sheetError" x-text="sheetError"></p>

        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="tutupSheet" style="flex:1;">Batal</button>
          <button type="submit" class="clay-btn" style="flex:1;">Simpan</button>
        </div>

        <button type="button" class="sheet-hapus" x-show="editingId" @click="mintaHapus">Hapus langkah ini</button>
      </form>
    </div>

    <!-- Konfirmasi hapus (pengganti confirm() bawaan browser) -->
    <div class="modal-backdrop" x-show="confirmDelete" x-cloak @click.self="batalHapus"
         x-transition:enter="modal-anim-enter" x-transition:enter-start="modal-anim-enter-start" x-transition:enter-end="modal-anim-enter-end"
         x-transition:leave="modal-anim-leave" x-transition:leave-start="modal-anim-leave-start" x-transition:leave-end="modal-anim-leave-end">
      <div class="modal-sheet stack"
           x-transition:enter="sheet-anim-enter" x-transition:enter-start="sheet-anim-enter-start" x-transition:enter-end="sheet-anim-enter-end"
           x-transition:leave="sheet-anim-leave" x-transition:leave-start="sheet-anim-leave-start" x-transition:leave-end="sheet-anim-leave-end">
        <h2 style="font-size:20px;">Hapus langkah ini?</h2>
        <p class="muted" style="font-size:14px;line-height:1.6;margin:0;">
          “<span x-text="confirmDelete?.title"></span>” akan hilang dari perjalanan<span x-show="jumlahItemDihapus">, beserta <span x-text="jumlahItemDihapus"></span> item checklist-nya</span>.
        </p>
        <div class="row" style="margin-top:8px;">
          <button type="button" class="clay-btn secondary" @click="batalHapus" style="flex:1;">Batal</button>
          <button type="button" class="clay-btn" @click="hapusTerkonfirmasi" style="flex:1;">Hapus</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom navigation (identik di semua halaman) -->
  <nav class="bottom-nav" aria-label="Navigasi utama" x-data="bottomNav">
    <div class="bottom-nav__bar">
      <a class="bottom-nav__item" href="./index.html" :class="{ 'is-active': isActive('index.html') }" :aria-current="isActive('index.html') ? 'page' : null">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Beranda</span>
